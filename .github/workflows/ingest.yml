# Runs the listing worker once a day on GitHub's free Actions minutes.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   DATABASE_URL       required
#   RENTCAST_API_KEY   needed when LISTING_SOURCES includes rentcast
# Variables (same page > Variables), all optional:
#   LISTING_SOURCES          default "sample,demo"; set to "rentcast" for real listings
#   RENTCAST_CITIES          default "sf"
#   RENTCAST_MONTHLY_LIMIT   default 45 (RentCast's free plan includes 50 requests a month)
name: Ingest listings

on:
  schedule:
    - cron: "17 14 * * *" # daily, about 7am Pacific
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        default: ingest
        type: choice
        options: [ingest, seed, retire-samples, stats]

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
      LISTING_SOURCES: ${{ vars.LISTING_SOURCES || 'sample,demo' }}
      RENTCAST_CITIES: ${{ vars.RENTCAST_CITIES || 'sf' }}
      RENTCAST_MONTHLY_LIMIT: ${{ vars.RENTCAST_MONTHLY_LIMIT || '45' }}
      RENTCAST_HOURS_BETWEEN: "24"
      RENTCAST_PAGES_PER_RUN: "1"
      COMMAND: ${{ github.event.inputs.command || 'ingest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Run
        run: |
          case "$COMMAND" in
            seed)           npm run seed ;;
            retire-samples) npm -w @getstabilized/worker run cli -- retire --source sample,demo ;;
            stats)          npm -w @getstabilized/worker run cli -- stats ;;
            *)              npm run ingest ;;
          esac
      - name: Usage
        if: always()
        run: npm -w @getstabilized/worker run cli -- stats
